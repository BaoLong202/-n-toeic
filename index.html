<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC Practice Workspace</title>
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #f9fafb;
    --bg-surface: #ffffff;
    --bg-subtle: #f3f4f6;
    --border: #e5e7eb;
    --border-hover: #d1d5db;
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    
    --brand: #2563eb;
    --brand-hover: #1d4ed8;
    --brand-subtle: #eff6ff;

    --success: #059669;
    --success-subtle: #ecfdf5;
    --danger: #dc2626;
    --danger-subtle: #fef2f2;
    
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  body.dark-theme {
    --bg-page: #0b0f17;
    --bg-surface: #111827;
    --bg-subtle: #1f2937;
    --border: #374151;
    --border-hover: #4b5563;
    --text-primary: #f9fafb;
    --text-secondary: #d1d5db;
    --text-muted: #6b7280;
    
    --brand: #3b82f6;
    --brand-hover: #60a5fa;
    --brand-subtle: #1e293b;

    --success: #10b981;
    --success-subtle: #064e3b;
    --danger: #ef4444;
    --danger-subtle: #450a0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    height: 100dvh;
    font-family: var(--font-sans);
    background: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Top Navigation */
  header {
    height: 52px;
    padding: 0 16px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
  }
  .brand-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--brand-subtle);
    color: var(--brand);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-outline {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-outline:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border-color: var(--border-hover);
  }

  /* Workspace Layout */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    border-right: 1px solid var(--border);
    background: var(--bg-surface);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .btn-create {
    width: 100%;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand);
    background: var(--brand-subtle);
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-create:hover {
    background: #dbeafe;
  }
  .test-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    background: var(--bg-surface);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .test-item:hover {
    border-color: var(--border-hover);
  }
  .test-item.active {
    border-color: var(--brand);
    background: var(--bg-page);
  }
  .test-item-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .test-item-meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .test-item-meta .active-flag {
    color: var(--success);
    font-weight: 600;
  }
  .test-item-actions {
    display: flex;
    gap: 6px;
  }
  .test-item-actions label, .test-item-actions button {
    font-family: inherit;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .test-item-actions .btn-delete {
    margin-left: auto;
    color: var(--danger);
    border-color: transparent;
  }
  .test-item-actions .btn-delete:hover {
    background: var(--danger-subtle);
  }

  /* Main Workspace */
  .main-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 12px;
    gap: 12px;
    overflow: hidden;
  }

  /* Audio Bar */
  .audio-toolbar {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .audio-toolbar audio {
    flex: 1;
    height: 32px;
  }
  .audio-empty {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Panels Grid */
  .panels-split {
    flex: 1;
    display: flex;
    gap: 12px;
    min-height: 0;
  }

  /* Document Viewer */
  .viewer-panel {
    flex: 1.3;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .viewer-tabs {
    display: flex;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    padding: 4px 6px;
    gap: 4px;
  }
  .viewer-tab {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .viewer-tab.active {
    background: var(--bg-surface);
    color: var(--text-primary);
    font-weight: 600;
  }
  .viewer-content {
    flex: 1;
    position: relative;
    overflow-y: auto;
  }
  .viewer-content iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Answer Sheet Panel */
  .sheet-panel {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sheet-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--bg-surface);
    flex-shrink: 0;
  }
  .sheet-header-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sheet-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .sheet-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .select-native {
    font-family: inherit;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-primary);
    outline: none;
  }
  .btn-submit {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    background: var(--brand);
    color: #ffffff;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-submit:hover {
    background: var(--brand-hover);
  }
  .btn-reset {
    font-family: inherit;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .btn-reset:hover {
    background: var(--bg-subtle);
  }

  /* Aim & Score Sub-bar */
  .score-strip {
    background: var(--bg-subtle);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    gap: 8px;
  }
  .aim-box {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
  }
  .aim-box input {
    width: 52px;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-weight: 600;
    font-size: 12px;
    text-align: center;
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  .score-metric {
    font-weight: 600;
    color: var(--text-primary);
  }

  /* Grid Questions */
  .sheet-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .q-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
    gap: 6px;
  }
  .q-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
  }
  .q-item.graded {
    background: var(--bg-subtle);
  }
  .q-number {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 20px;
  }
  .q-options {
    display: flex;
    gap: 3px;
  }
  .q-bubble {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .q-bubble:hover {
    border-color: var(--text-muted);
  }
  .q-bubble.selected {
    background: var(--brand);
    color: #ffffff;
    border-color: var(--brand);
  }
  .q-item.graded .q-bubble.selected.correct {
    background: var(--success);
    border-color: var(--success);
    color: #ffffff;
  }
  .q-item.graded .q-bubble.selected.wrong {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
  }
  .q-item.graded .q-bubble.right-answer:not(.selected) {
    border-color: var(--success);
    color: var(--success);
    background: var(--success-subtle);
  }

  /* Explanation / Notes */
  .review-section {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .review-header {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .review-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    background: var(--bg-surface);
  }
  .review-card-title {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .review-card-body {
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-secondary);
  }

  /* Transcript layout */
  .script-container {
    padding: 16px;
  }
  .script-container h3 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--brand);
    margin: 16px 0 10px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .script-question, .script-dialogue {
    margin-bottom: 12px;
    padding: 10px 12px;
    background: var(--bg-subtle);
    border-radius: 6px;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .script-speaker {
    font-weight: 600;
    color: var(--text-primary);
  }
  .script-opt.correct-pink {
    color: var(--brand);
    font-weight: 600;
  }

  /* Vocab Drawer */
  .drawer {
    position: fixed;
    top: 0;
    right: -360px;
    width: 340px;
    max-width: 90vw;
    height: 100%;
    background: var(--bg-surface);
    border-left: 1px solid var(--border);
    z-index: 50;
    transition: right 0.2s ease;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  .drawer.open {
    right: 0;
  }
  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .drawer-title {
    font-size: 14px;
    font-weight: 700;
  }
  .drawer-close {
    background: transparent;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: var(--text-muted);
  }
  .search-row {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .search-row input {
    flex: 1;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-primary);
    outline: none;
  }
  .search-row input:focus {
    border-color: var(--brand);
  }
  .search-row button {
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: none;
    background: var(--brand);
    color: #ffffff;
    cursor: pointer;
  }
  .vocab-body {
    flex: 1;
    overflow-y: auto;
    font-size: 13px;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.2);
    z-index: 40;
    display: none;
  }
  .backdrop.open { display: block; }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    max-width: 320px;
    line-height: 1.5;
  }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      top: 52px;
      left: 0;
      bottom: 0;
      z-index: 45;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .panels-split { flex-direction: column; }
    .viewer-panel { height: 40vh; flex: none; }
  }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <button id="sidebarToggleBtn" class="btn-outline" style="padding:4px 8px;">Mục lục</button>
    <div class="brand-title">
      TOEIC
      <span class="brand-badge">ETS Series</span>
    </div>
  </div>
  <div class="header-actions">
    <button id="themeToggleBtn" class="btn-outline">Theme</button>
    <button id="vocabToggleBtn" class="btn-outline">Tra từ</button>
  </div>
</header>

<div class="workspace">
  <div class="sidebar" id="sidebar">
    <button class="btn-create" id="addTestBtn">+ Thêm đề thi</button>
    <div id="testList" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <div class="main-stage" id="mainStage">
    <div class="empty-state">
      Chọn <b>+ Thêm đề thi</b> từ thanh bên trái để bắt đầu luyện tập.
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <div class="drawer" id="vocabDrawer">
    <div class="drawer-head">
      <span class="drawer-title">Từ điển tra cứu</span>
      <button class="drawer-close" id="vocabCloseBtn">&times;</button>
    </div>
    <div class="search-row">
      <input type="text" id="vocabInput" placeholder="Nhập từ cần tra...">
      <button id="vocabSearchBtn">Tra</button>
    </div>
    <div class="vocab-body" id="vocabResult"></div>
  </div>
</div>

<script>
// Toàn bộ logic lõi giữ nguyên 100%
window.TOEIC_KEYS = window.TOEIC_KEYS || {};
window.TOEIC_SCRIPTS = window.TOEIC_SCRIPTS || {};
window.TOEIC_EXPLANATIONS = window.TOEIC_EXPLANATIONS || {};

function parseKey(text) {
  if (typeof text === 'object') return text;
  const key = {};
  const re = /(\d{1,3})\s*[.\-:)]?\s*([A-Da-d])/g;
  let m;
  while ((m = re.exec(text)) !== null) key[parseInt(m[1], 10)] = m[2].toUpperCase();
  return key;
}
window.parseKey = parseKey;

function ensureTestDataLoaded(testNum, callback) {
  if (window.TOEIC_SCRIPTS && window.TOEIC_SCRIPTS[testNum]) {
    if (callback) callback();
    return;
  }
  const script = document.createElement('script');
  script.src = `./data/test${testNum}.js?t=` + Date.now();
  script.onload = () => {
    renderMain();
    if (callback) callback();
  };
  script.onerror = () => {
    console.error(`Không thể nạp dữ liệu từ: ./data/test${testNum}.js`);
    if (callback) callback();
  };
  document.head.appendChild(script);
}

const themeToggleBtn = document.getElementById('themeToggleBtn');
if (localStorage.getItem('toeic_theme') === 'dark') {
  document.body.classList.add('dark-theme');
}
themeToggleBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-theme');
  const isDark = document.body.classList.contains('dark-theme');
  localStorage.setItem('toeic_theme', isDark ? 'dark' : 'light');
});

let tests = [];
let activeId = null;
let idCounter = 0;
let userAimScore = parseInt(localStorage.getItem('toeic_user_aim') || '700', 10);
const OPTS = ['A','B','C','D'];

const sidebarList = document.getElementById('testList');
const sidebarEl = document.getElementById('sidebar');
const mainStage = document.getElementById('mainStage');
const backdrop = document.getElementById('backdrop');

document.getElementById('sidebarToggleBtn').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  backdrop.classList.toggle('open', sidebarEl.classList.contains('open'));
});

document.getElementById('addTestBtn').addEventListener('click', () => {
  idCounter++;
  const testNum = ((idCounter - 1) % 10) + 1;
  const t = {
    id: idCounter, testNum: testNum, name: 'ETS Test ' + testNum,
    pdfFile: null, pdfUrl: null, audioFile: null, audioUrl: null,
    viewMode: 'pdf', isGraded: false,
    numQuestions: 200, answers: {}, notes: {}
  };
  tests.push(t);
  activeId = t.id;
  
  ensureTestDataLoaded(testNum, () => {
    renderSidebar(); 
    renderMain();
  });

  if (window.innerWidth <= 768) { sidebarEl.classList.remove('open'); backdrop.classList.remove('open'); }
});

function renderSidebar() {
  sidebarList.innerHTML = '';
  tests.forEach(t => {
    const card = document.createElement('div');
    card.className = 'test-item' + (t.id === activeId ? ' active' : '');
    card.addEventListener('click', (e) => {
      if (['INPUT','BUTTON','LABEL','SELECT'].includes(e.target.tagName)) return;
      activeId = t.id; 
      ensureTestDataLoaded(t.testNum, () => {
        renderSidebar(); 
        renderMain();
      });
      if (window.innerWidth <= 768) { sidebarEl.classList.remove('open'); backdrop.classList.remove('open'); }
    });

    card.innerHTML = `
      <div class="test-item-title">${t.name}</div>
      <div class="test-item-meta">
        <span class="${t.pdfFile ? 'active-flag' : ''}">${t.pdfFile ? 'PDF đính kèm' : 'Chưa có PDF'}</span>
        <span>•</span>
        <span class="${t.audioFile ? 'active-flag' : ''}">${t.audioFile ? 'Audio đính kèm' : 'Chưa có Audio'}</span>
      </div>`;

    const btnRow = document.createElement('div');
    btnRow.className = 'test-item-actions';

    const pdfLabel = document.createElement('label'); pdfLabel.textContent = 'PDF';
    const pdfInput = document.createElement('input'); pdfInput.type = 'file'; pdfInput.accept = 'application/pdf'; pdfInput.style.display = 'none';
    pdfInput.addEventListener('change', (e) => {
      if(e.target.files[0]) { t.pdfFile = e.target.files[0]; t.pdfUrl = URL.createObjectURL(t.pdfFile); renderSidebar(); renderMain(); }
    });
    pdfLabel.appendChild(pdfInput); btnRow.appendChild(pdfLabel);

    const audioLabel = document.createElement('label'); audioLabel.textContent = 'Audio';
    const audioInput = document.createElement('input'); audioInput.type = 'file'; audioInput.accept = 'audio/*'; audioInput.style.display = 'none';
    audioInput.addEventListener('change', (e) => {
      if(e.target.files[0]) { t.audioFile = e.target.files[0]; t.audioUrl = URL.createObjectURL(t.audioFile); renderSidebar(); renderMain(); }
    });
    audioLabel.appendChild(audioInput); btnRow.appendChild(audioLabel);

    const delBtn = document.createElement('button'); delBtn.className = 'btn-delete'; delBtn.textContent = 'Xoá';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tests = tests.filter(x => x.id !== t.id);
      if (activeId === t.id) activeId = tests.length ? tests[0].id : null;
      renderSidebar(); renderMain();
    });
    btnRow.appendChild(delBtn); card.appendChild(btnRow); sidebarList.appendChild(card);
  });
}

function convertRawToScaled(lcCorrect, rcCorrect) {
  function roundTo5(num) { return Math.round(num / 5) * 5; }
  let lcScore = 5;
  if (lcCorrect > 0) { 
    let raw = lcCorrect * 5.2 - 15; 
    if (lcCorrect >= 90) raw = 450 + (lcCorrect - 90) * 4.5; 
    lcScore = Math.min(495, Math.max(5, roundTo5(raw))); 
  }
  let rcScore = 5;
  if (rcCorrect > 0) { 
    let raw = rcCorrect * 5.0 - 20; 
    if (rcCorrect >= 90) raw = 440 + (rcCorrect - 90) * 5.5; 
    rcScore = Math.min(495, Math.max(5, roundTo5(raw))); 
  }
  return { lc: lcScore, rc: rcScore, total: lcScore + rcScore };
}

function updateQuestionRowDOM(t, q) {
  const row = document.getElementById(`qrow-` + q);
  if (!row) return;
  const selectedLetter = t.answers[q];
  row.querySelectorAll('.q-bubble').forEach(b => {
    const letter = b.getAttribute('data-letter');
    if (letter === selectedLetter) {
      b.classList.add('selected');
    } else {
      b.classList.remove('selected');
    }
  });
}

function renderMain() {
  const t = tests.find(x => x.id === activeId);
  if (!t) { 
    mainStage.innerHTML = `<div class="empty-state">Chọn <b>+ Thêm đề thi</b> từ thanh bên trái để bắt đầu luyện tập.</div>`; 
    return; 
  }
  mainStage.innerHTML = '';

  const testKey = window.TOEIC_KEYS[t.testNum] || {};

  const audioBar = document.createElement('div'); 
  audioBar.className = 'audio-toolbar';
  audioBar.innerHTML = t.audioUrl 
    ? `<audio controls src="${t.audioUrl}"></audio>` 
    : `<div class="audio-empty">File âm thanh chưa được tải lên</div>`;
  mainStage.appendChild(audioBar);

  const panels = document.createElement('div'); panels.className = 'panels-split';

  // Left viewer
  const viewerPanel = document.createElement('div'); viewerPanel.className = 'viewer-panel';
  viewerPanel.innerHTML = `
    <div class="viewer-tabs">
      <button class="viewer-tab ${t.viewMode === 'pdf' ? 'active' : ''}" id="tabPdf">Đề bài (PDF)</button>
      <button class="viewer-tab ${t.viewMode === 'transcript' ? 'active' : ''}" id="tabTranscript">Listening Script</button>
    </div>
    <div class="viewer-content" id="docArea"></div>`;
  panels.appendChild(viewerPanel);

  // Right Sheet
  const sheetPanel = document.createElement('div'); sheetPanel.className = 'sheet-panel';
  sheetPanel.innerHTML = `
    <div class="sheet-header">
      <div class="sheet-header-info">
        <span class="sheet-title">${t.name}</span>
      </div>
      <div class="sheet-actions">
        <select id="testSelector" class="select-native"></select>
        <button id="clearBtn" class="btn-reset">Làm lại</button>
        <button id="gradeBtn" class="btn-submit">Chấm bài</button>
      </div>
    </div>
    <div class="score-strip">
      <div class="aim-box">
        <span>Mục tiêu:</span>
        <input type="number" id="aimInput" value="${userAimScore}" step="50">
      </div>
      <div id="scoreDisplay" class="score-metric">Đã hoàn thành: ${Object.keys(t.answers).length} / 200</div>
    </div>
    <div class="sheet-body">
      <div class="q-grid" id="qgridArea"></div>
      <div id="notesSectionContainer" class="review-section"></div>
    </div>
  `;
  panels.appendChild(sheetPanel); 
  mainStage.appendChild(panels);

  // Select test
  const selTest = document.getElementById('testSelector');
  for (let i = 1; i <= 10; i++) {
    const opt = document.createElement('option'); opt.value = i; opt.textContent = 'Đề ' + i;
    if (t.testNum === i) opt.selected = true;
    selTest.appendChild(opt);
  }
  selTest.addEventListener('change', (e) => {
    t.testNum = parseInt(e.target.value, 10); 
    t.name = 'ETS Test ' + t.testNum; 
    t.isGraded = false; 
    t.answers = {};
    ensureTestDataLoaded(t.testNum, () => {
      renderSidebar(); 
      renderMain();
    });
  });

  document.getElementById('clearBtn').addEventListener('click', () => { t.answers = {}; t.isGraded = false; renderMain(); });
  document.getElementById('gradeBtn').addEventListener('click', () => { t.isGraded = true; renderMain(); });
  document.getElementById('aimInput').addEventListener('change', (e) => { userAimScore = parseInt(e.target.value, 10) || 700; localStorage.setItem('toeic_user_aim', userAimScore); renderMain(); });

  const grid = document.getElementById('qgridArea');
  for (let q = 1; q <= t.numQuestions; q++) {
    const hasKey = !!testKey[q];
    const row = document.createElement('div'); 
    row.id = `qrow-${q}`;
    row.className = 'q-item' + (t.isGraded && hasKey ? ' graded' : '');
    
    let optsHtml = '<div class="q-options">';
    OPTS.forEach(letter => {
      let cls = 'q-bubble';
      if (t.answers[q] === letter) cls += ' selected';
      if (t.isGraded && testKey[q]) {
        if (letter === testKey[q]) cls += ' right-answer';
        if (t.answers[q] === letter) cls += (letter === testKey[q] ? ' correct' : ' wrong');
      }
      optsHtml += `<button class="${cls}" data-letter="${letter}">${letter}</button>`;
    });
    optsHtml += '</div>';

    row.innerHTML = `<span class="q-number">${q}</span>` + optsHtml;
    
    row.querySelectorAll('.q-bubble').forEach(b => {
      b.addEventListener('click', () => {
        if (!t.isGraded) { 
          const letter = b.getAttribute('data-letter');
          t.answers[q] = (t.answers[q] === letter) ? undefined : letter; 
          updateQuestionRowDOM(t, q);
          document.getElementById('scoreDisplay').textContent = `Đã chọn: ${Object.keys(t.answers).length} / 200`;
        }
      });
    });
    grid.appendChild(row);
  }

  const docArea = document.getElementById('docArea');
  if (t.viewMode === 'pdf') {
    docArea.innerHTML = t.pdfUrl 
      ? `<iframe src="${t.pdfUrl}"></iframe>` 
      : `<div class="empty-state" style="padding:40px 10px;">Chưa nạp tài liệu PDF cho đề thi này.</div>`;
  } else {
    const scriptHtml = window.TOEIC_SCRIPTS[t.testNum] || '';
    docArea.innerHTML = scriptHtml 
      ? `<div class="script-container">${scriptHtml}</div>` 
      : `<div class="empty-state" style="padding:40px 10px;">Chưa tìm thấy Transcript cho đề này.</div>`;
  }

  document.getElementById('tabPdf').addEventListener('click', () => { t.viewMode = 'pdf'; renderMain(); });
  document.getElementById('tabTranscript').addEventListener('click', () => { t.viewMode = 'transcript'; renderMain(); });

  if (t.isGraded) {
    const gradedCount = Object.keys(testKey).length;
    let lcCorrect = 0, rcCorrect = 0;
    Object.keys(testKey).forEach(qStr => {
      const q = parseInt(qStr, 10);
      if (t.answers[q] === testKey[q]) { q <= 100 ? lcCorrect++ : rcCorrect++; }
    });
    
    const totalCorrect = lcCorrect + rcCorrect;
    const scaled = convertRawToScaled(lcCorrect, rcCorrect);
    
    const scoreSpan = document.getElementById('scoreDisplay');
    scoreSpan.innerHTML = `Kết quả: <b>${totalCorrect}</b>/${gradedCount} câu • Điểm dự tính: <b>${scaled.total}</b>/990 (LC ${scaled.lc} | RC ${scaled.rc})`;

    const wrongQs = [];
    for (let q = 1; q <= 200; q++) { if (testKey[q] && t.answers[q] && t.answers[q] !== testKey[q]) wrongQs.push(q); }
    if (wrongQs.length > 0) {
      const currentExpl = window.TOEIC_EXPLANATIONS[t.testNum] || {};
      const notesContainer = document.getElementById('notesSectionContainer');
      let html = `<div class="review-header">Phân tích câu làm sai (${wrongQs.length})</div>`;
      wrongQs.forEach(q => {
        const expl = currentExpl[q] || 'Chưa có giải thích chi tiết.';
        html += `
          <div class="review-card">
            <div class="review-card-title">Câu ${q} • Đã chọn: <span style="color:var(--danger)">${t.answers[q]}</span> | Đúng: <span style="color:var(--success)">${testKey[q]}</span></div>
            <div class="review-card-body">${expl}</div>
          </div>`;
      });
      notesContainer.innerHTML = html;
    }
  }
}

// Logic Tra từ
const vocabDrawer = document.getElementById('vocabDrawer');
const vocabInput = document.getElementById('vocabInput');
const vocabResult = document.getElementById('vocabResult');

document.getElementById('vocabToggleBtn').addEventListener('click', () => { vocabDrawer.classList.add('open'); backdrop.classList.add('open'); vocabInput.focus(); });
document.getElementById('vocabCloseBtn').addEventListener('click', () => { vocabDrawer.classList.remove('open'); backdrop.classList.remove('open'); });
backdrop.addEventListener('click', () => { vocabDrawer.classList.remove('open'); backdrop.classList.remove('open'); sidebarEl.classList.remove('open'); });

async function lookupWord() {
  const word = vocabInput.value.trim(); if (!word) return;
  vocabResult.innerHTML = '<div style="color:var(--text-muted); padding:10px 0;">Đang tra cứu dữ liệu...</div>';
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(word);
    const res = await fetch(url);
    const data = await res.json();
    const vi = data[0].map(s => s[0]).join('');
    vocabResult.innerHTML = `
      <div style="font-weight:700; font-size:16px; margin-bottom:8px; color:var(--brand);">${word}</div>
      <div style="font-size:13px; line-height:1.6; color:var(--text-secondary); background:var(--bg-subtle); padding:10px; border-radius:6px;">${vi}</div>
      <div style="margin-top:12px;"><a href="https://dictionary.cambridge.org/dictionary/english/${encodeURIComponent(word)}" target="_blank" style="color:var(--brand); font-size:12px; text-decoration:none;">Xem thêm trên Cambridge Dictionary &rarr;</a></div>
    `;
  } catch (err) {
    vocabResult.innerHTML = '<div style="color:var(--danger); font-size:12px;">Không thể tra từ vựng lúc này.</div>';
  }
}
document.getElementById('vocabSearchBtn').addEventListener('click', lookupWord);
vocabInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookupWord(); });

renderSidebar(); 
renderMain();
</script>
