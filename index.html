<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện Thi TOEIC 10 Tests</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --border: #e2e2e6; --text: #1c1c1f; --muted: #6b6b73;
    --accent: #2f6fed; --accent-soft: #e8f0fe; --danger: #d9463c; --good: #1f9254; --bad: #d9463c;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#17181b; --panel:#1f2024; --border:#303136; --text:#eceef1; --muted:#96979e; --accent:#6c9bff; --accent-soft:#23324f; }
  }
  :root[data-theme="dark"] { --bg:#17181b; --panel:#1f2024; --border:#303136; --text:#eceef1; --muted:#96979e; --accent:#6c9bff; --accent-soft:#23324f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
  header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 6px; }
  header .hint { font-size: 11px; color: var(--muted); display: none; }
  @media (min-width: 768px) { header .hint { display: block; } }
  
  .layout { flex: 1; display: flex; min-height: 0; position: relative; }
  .sidebar { width: 280px; max-width: 100%; border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; flex-shrink: 0; background: var(--panel); }
  
  .add-btn { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 13px; cursor: pointer; margin-bottom: 10px; font-weight: 500; }
  .test-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--bg); cursor: pointer; }
  .test-card.active { border-color: var(--accent); background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .test-card .name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .test-card .status { font-size: 11px; color: var(--muted); display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .test-card .status span.ok { color: var(--good); font-weight: bold; }
  .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-btns label, .row-btns button { font-size: 11px; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  .row-btns .del { color: var(--danger); border-color: var(--danger); margin-left: auto; }
  input[type="file"] { display: none; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 10px; gap: 10px; min-height: 0; }
  .empty { margin: auto; color: var(--muted); text-align: center; font-size: 14px; max-width: 340px; line-height: 1.5; padding: 20px; }
  
  .player-bar { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .player-bar audio { flex: 1; min-width: 180px; height: 36px; }
  .player-bar .speed { display: flex; gap: 4px; }
  .player-bar .speed button { font-size: 11px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .player-bar .speed button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  .center-split { flex: 1; display: flex; gap: 10px; min-height: 0; }
  .doc-wrap { flex: 1.2; min-height: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
  .doc-tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); padding: 4px 6px; gap: 6px; }
  .doc-tab { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
  .doc-tab.active { background: var(--panel); color: var(--text); border-color: var(--border); font-weight: 600; }
  .doc-content { flex: 1; position: relative; overflow-y: auto; padding: 12px; }
  .doc-content iframe { width: 100%; height: 100%; border: none; }
  .no-file { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; gap: 6px; }

  .answer-panel { flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .aim-panel { background: var(--accent-soft); border-bottom: 1px solid var(--border); padding: 8px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .aim-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .aim-input-wrap { display: flex; align-items: center; gap: 4px; }
  .aim-input-wrap input { width: 55px; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--accent); font-weight: bold; text-align: center; background: var(--panel); color: var(--text); }
  .aim-feedback { font-size: 11.5px; line-height: 1.4; color: var(--text); background: var(--panel); padding: 6px 8px; border-radius: 6px; border-left: 3px solid var(--accent); }

  .answer-head { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .answer-head strong { font-size: 13px; }
  .answer-head .score { font-size: 12px; color: var(--muted); }
  .answer-head .score.done { color: var(--accent); font-weight: 700; }
  .answer-head-btns { display: flex; gap: 6px; }
  .answer-head-btns button, .answer-head-btns select { font-size: 11px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }

  .scroll-area { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; align-content: start; }
  .qrow { display: flex; align-items: center; justify-content: space-between; gap: 2px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; }
  .qrow .qnum { font-size: 11px; color: var(--muted); font-weight: 600; min-width: 22px; }
  .qrow .opt { font-size: 12px; font-weight: 600; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .qrow .opt.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qrow.graded .opt.selected.correct { background: var(--good); border-color: var(--good); }
  .qrow.graded .opt.selected.wrong { background: var(--bad); border-color: var(--bad); }
  .qrow.graded .opt.right-answer:not(.selected) { border-color: var(--good); color: var(--good); font-weight: bold; background: rgba(31, 146, 84, 0.1); }

  .notes-section { margin-top: 14px; }
  .notes-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--danger); display: flex; align-items: center; gap: 6px; }
  .note-item { border: 1px solid var(--border); border-left: 4px solid var(--bad); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .note-item .note-head { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .note-item .explanation-box { font-size: 12px; line-height: 1.5; background: var(--bg); padding: 8px; border-radius: 6px; border: 1px dashed var(--border); color: var(--text); }

  .script-container h3 { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-top: 20px; font-size: 14px; }
  .script-item { margin-bottom: 10px; padding: 8px; border-radius: 6px; background: var(--bg); border-left: 3px solid var(--accent); font-size: 12.5px; }
  .script-item .qnum { font-weight: bold; color: var(--good); }
  .script-item .right-ans { font-weight: bold; color: var(--good); }
  .script-dialogue { margin-bottom: 12px; padding: 10px; border-radius: 6px; background: var(--bg); font-size: 12.5px; line-height: 1.5; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; top: 48px; left: 0; bottom: 0; z-index: 25; width: 85%; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.15); }
    .sidebar.open { transform: translateX(0); }
    .center-split { flex-direction: column; }
    .doc-wrap { height: 42vh; flex: none; }
    .answer-panel { flex: 1; }
    .qgrid { grid-template-columns: repeat(2, 1fr); }
    .qrow .opt { width: 30px; height: 30px; font-size: 13px; }
  }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
  .overlay.open { display: block; }
</style>

</head>
<body>
<div class="app">
  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="sidebarToggleBtn" style="padding:4px 8px;">☰ Đề</button>
      <h1>📘 Luyện Thi TOEIC (10 Tests)</h1>
      <div class="hint">Tự động nạp Script Listening & Lời giải Reading</div>
    </div>
  </header>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <button class="add-btn" id="addTestBtn">+ Thêm đề thi mới</button>
      <div id="testList"></div>
    </div>
    <div class="main" id="main">
      <div class="empty" id="emptyMsg">
        Bấm <b>"+ Thêm đề thi mới"</b> và chọn Test bạn muốn làm.<br><br>
        Hệ thống tự nạp toàn bộ <b>Đáp án chuẩn, Lời thoại Listening và Lời giải thích Reading</b> cho bạn!
      </div>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>
</div>

<script>
let tests = [];
let activeId = null;
let idCounter = 0;
let userAimScore = parseInt(localStorage.getItem('toeic_user_aim') || '700', 10);
const OPTS = ['A','B','C','D'];

const sidebarList = document.getElementById('testList');
const sidebarEl = document.getElementById('sidebar');
const mainEl = document.getElementById('main');
const emptyMsg = document.getElementById('emptyMsg');
const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');

sidebarToggleBtn.addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  overlay.classList.toggle('open', sidebarEl.classList.contains('open'));
});

document.getElementById('addTestBtn').addEventListener('click', () => {
  idCounter++;
  const testNum = ((idCounter - 1) % 10) + 1;
  const t = {
    id: idCounter,
    testNum: testNum,
    name: 'ETS Test ' + testNum,
    pdfFile: null, pdfUrl: null,
    audioFile: null, audioUrl: null,
    viewMode: 'pdf',
    key: (window.TOEIC_KEYS && window.TOEIC_KEYS[testNum]) ? window.TOEIC_KEYS[testNum] : {},
    numQuestions: 200, answers: {}, notes: {}
  };
  tests.push(t);
  activeId = t.id;
  renderSidebar();
  renderMain();
  if (window.innerWidth <= 768) {
    sidebarEl.classList.remove('open');
    overlay.classList.remove('open');
  }
});

function renderSidebar() {
  sidebarList.innerHTML = '';
  tests.forEach(t => {
    const card = document.createElement('div');
    card.className = 'test-card' + (t.id === activeId ? ' active' : '');
    card.addEventListener('click', (e) => {
      if (['INPUT','BUTTON','LABEL','SELECT'].includes(e.target.tagName)) return;
      activeId = t.id; 
      renderSidebar(); 
      renderMain();
      if (window.innerWidth <= 768) {
        sidebarEl.classList.remove('open');
        overlay.classList.remove('open');
      }
    });

    const nameRow = document.createElement('div');
    nameRow.className = 'name';
    nameRow.innerHTML = `<span>${t.name}</span>`;
    card.appendChild(nameRow);

    const status = document.createElement('div');
    status.className = 'status';
    status.innerHTML =
      '<span class="' + (t.pdfFile ? 'ok' : '') + '">' + (t.pdfFile ? '✓ Đề' : '– Đề') + '</span>' +
      '<span class="' + (t.audioFile ? 'ok' : '') + '">' + (t.audioFile ? '✓ Audio' : '– Audio') + '</span>' +
      '<span class="ok">✓ Sẵn sàng</span>';
    card.appendChild(status);

    const btnRow = document.createElement('div');
    btnRow.className = 'row-btns';

    const pdfLabel = document.createElement('label');
    pdfLabel.textContent = t.pdfFile ? 'Đổi Đề' : 'Tải Đề';
    const pdfInput = document.createElement('input');
    pdfInput.type = 'file'; pdfInput.accept = 'application/pdf';
    pdfInput.addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (t.pdfUrl) URL.revokeObjectURL(t.pdfUrl);
      t.pdfFile = f; t.pdfUrl = URL.createObjectURL(f);
      renderSidebar(); renderMain();
    });
    pdfLabel.appendChild(pdfInput);
    btnRow.appendChild(pdfLabel);

    const audioLabel = document.createElement('label');
    audioLabel.textContent = t.audioFile ? 'Đổi Audio' : 'Tải Audio';
    const audioInput = document.createElement('input');
    audioInput.type = 'file'; audioInput.accept = 'audio/*';
    audioInput.addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (t.audioUrl) URL.revokeObjectURL(t.audioUrl);
      t.audioFile = f; t.audioUrl = URL.createObjectURL(f);
      renderSidebar(); renderMain();
    });
    audioLabel.appendChild(audioInput);
    btnRow.appendChild(audioLabel);

    const delBtn = document.createElement('button');
    delBtn.className = 'del'; delBtn.textContent = 'Xoá';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (t.pdfUrl) URL.revokeObjectURL(t.pdfUrl);
      if (t.audioUrl) URL.revokeObjectURL(t.audioUrl);
      tests = tests.filter(x => x.id !== t.id);
      if (activeId === t.id) activeId = tests.length ? tests[0].id : null;
      renderSidebar(); renderMain();
    });
    btnRow.appendChild(delBtn);

    card.appendChild(btnRow);
    sidebarList.appendChild(card);
  });
}

function convertRawToScaled(lcCorrect, rcCorrect) {
  let lcScore = 5;
  if (lcCorrect > 0) {
    lcScore = Math.min(495, Math.round(lcCorrect * 5.2 - 15));
    if (lcCorrect >= 90) lcScore = Math.min(495, 450 + (lcCorrect - 90) * 4.5);
    if (lcScore < 5) lcScore = 5;
  }
  let rcScore = 5;
  if (rcCorrect > 0) {
    rcScore = Math.min(495, Math.round(rcCorrect * 5.0 - 20));
    if (rcCorrect >= 90) rcScore = Math.min(495, 440 + (rcCorrect - 90) * 5.5);
    if (rcScore < 5) rcScore = 5;
  }
  return { lc: lcScore, rc: rcScore, total: lcScore + rcScore };
}

function updateScoreAndAimDisplay(t) {
  const scoreSpan = document.getElementById('scoreDisplay');
  const aimFeedback = document.getElementById('aimFeedback');
  if (!scoreSpan || !aimFeedback) return;

  const gradedKeys = Object.keys(t.key);
  const gradedCount = gradedKeys.length;
  const answeredCount = Object.keys(t.answers).length;

  if (gradedCount > 0) {
    let lcCorrect = 0, rcCorrect = 0;
    gradedKeys.forEach(qStr => {
      const q = parseInt(qStr, 10);
      if (t.answers[q] === t.key[q]) {
        if (q <= 100) lcCorrect++;
        else rcCorrect++;
      }
    });

    const totalCorrect = lcCorrect + rcCorrect;
    const scaled = convertRawToScaled(lcCorrect, rcCorrect);

    scoreSpan.className = 'score done';
    scoreSpan.innerHTML = `🎯 <b>${scaled.total}</b>/990 <small>(LC: ${scaled.lc} | RC: ${scaled.rc})</small>`;

    const diff = userAimScore - scaled.total;
    if (diff <= 0) {
      aimFeedback.innerHTML = `🎉 <b>CHÚC MỪNG!</b> Bạn đã vượt mục tiêu <b>${userAimScore}</b> điểm TOEIC (Hiện đạt: <b>${scaled.total}</b> điểm)!`;
      aimFeedback.style.borderLeftColor = 'var(--good)';
    } else {
      const neededQuestions = Math.ceil(diff / 5);
      aimFeedback.innerHTML = `
        ⚡ Điểm hiện tại: <b>${scaled.total}</b> / Aim <b>${userAimScore}</b> (Đúng ${totalCorrect}/${gradedCount} câu).<br>
        👉 Bạn còn thiếu <b>${diff} điểm</b>. Cần làm <b>đúng thêm khoảng ${neededQuestions} câu</b> nữa để cán mốc ${userAimScore}!
      `;
      aimFeedback.style.borderLeftColor = 'var(--danger)';
    }
  } else {
    scoreSpan.className = 'score';
    scoreSpan.textContent = `Đã chọn: ${answeredCount} / ${t.numQuestions}`;
    aimFeedback.innerHTML = `💡 Đang làm <b>${t.name}</b> (Aim: <b>${userAimScore}</b>). Chọn đáp án để chấm điểm ngay!`;
  }
}

function updateQuestionRowDOM(t, q) {
  const row = document.getElementById(`qrow-${q}`);
  if (!row) return;

  const isGraded = !!t.key[q];
  if (isGraded) row.classList.add('graded');
  else row.classList.remove('graded');

  const selectedLetter = t.answers[q];
  const correctLetter = t.key[q];

  const btns = row.querySelectorAll('.opt');
  btns.forEach(b => {
    const letter = b.getAttribute('data-letter');
    b.className = 'opt';
    if (selectedLetter === letter) b.classList.add('selected');
    if (isGraded) {
      if (letter === correctLetter) b.classList.add('right-answer');
      if (selectedLetter === letter && letter === correctLetter) b.classList.add('correct');
      if (selectedLetter === letter && letter !== correctLetter) b.classList.add('wrong');
    }
  });

  renderNotesSection(t);
}

function renderNotesSection(t) {
  let notesContainer = document.getElementById('notesSectionContainer');
  if (!notesContainer) return;

  const wrongQs = [];
  for (let q = 1; q <= t.numQuestions; q++) {
    if (t.key[q] && t.answers[q] && t.answers[q] !== t.key[q]) {
      wrongQs.push(q);
    }
  }

  if (wrongQs.length === 0) {
    notesContainer.innerHTML = '';
    return;
  }

  const currentExpl = (window.TOEIC_EXPLANATIONS && window.TOEIC_EXPLANATIONS[t.testNum]) ? window.TOEIC_EXPLANATIONS[t.testNum] : {};

  let html = `<div class="notes-title">⚠️ Danh sách câu sai (${wrongQs.length}) — Lời giải chi tiết:</div>`;
  wrongQs.forEach(q => {
    const defaultExpl = currentExpl[q] || `<i>(Đang cập nhật lời giải cho câu ${q} của ${t.name}...)</i>`;
    html += `
      <div class="note-item">
        <div class="note-head">
          Câu ${q}: Bạn chọn <b style="color:var(--bad)">${t.answers[q]}</b> — Đáp án đúng: <b style="color:var(--good)">${t.key[q]}</b>
        </div>
        <div class="explanation-box">${defaultExpl}</div>
      </div>
    `;
  });

  notesContainer.innerHTML = html;
}

function updateDocViewer(t) {
  const contentArea = document.getElementById('docContentArea');
  if (!contentArea) return;

  if (t.viewMode === 'pdf') {
    if (t.pdfUrl) {
      contentArea.innerHTML = `<iframe src="${t.pdfUrl}"></iframe>`;
    } else {
      contentArea.innerHTML = `
        <div class="no-file">
          <span>Chưa có file Đề thi PDF</span>
          <small>Tải file PDF từ danh sách đề bên trái.</small>
        </div>
      `;
    }
  } else {
    const scriptHtml = (window.TOEIC_SCRIPTS && window.TOEIC_SCRIPTS[t.testNum]) ? window.TOEIC_SCRIPTS[t.testNum] : null;
    if (scriptHtml) {
      contentArea.innerHTML = `<div class="script-container"><h2>📘 Lời thoại Listening: ${t.name}</h2>${scriptHtml}</div>`;
    } else {
      contentArea.innerHTML = `
        <div class="no-file">
          <span>Đang tải lời thoại cho ${t.name}...</span>
        </div>
      `;
    }
  }
}

function renderMain() {
  const t = tests.find(x => x.id === activeId);
  if (!t) { mainEl.innerHTML = ''; mainEl.appendChild(emptyMsg); return; }
  mainEl.innerHTML = '';

  const playerBar = document.createElement('div');
  playerBar.className = 'player-bar';
  if (t.audioUrl) {
    const audio = document.createElement('audio');
    audio.controls = true; audio.src = t.audioUrl;
    playerBar.appendChild(audio);
    const speedWrap = document.createElement('div');
    speedWrap.className = 'speed';
    [0.75, 1, 1.25, 1.5].forEach(s => {
      const b = document.createElement('button');
      b.textContent = s + 'x';
      if (s === 1) b.classList.add('on');
      b.addEventListener('click', () => {
        audio.playbackRate = s;
        speedWrap.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
      });
      speedWrap.appendChild(b);
    });
    playerBar.appendChild(speedWrap);
  } else {
    const msg = document.createElement('div');
    msg.style.color = 'var(--muted)'; msg.style.fontSize = '12px';
    msg.textContent = 'Chưa tải file audio — hãy tải ở danh sách đề.';
    playerBar.appendChild(msg);
  }
  mainEl.appendChild(playerBar);

  const split = document.createElement('div');
  split.className = 'center-split';

  const docWrap = document.createElement('div');
  docWrap.className = 'doc-wrap';

  const docTabs = document.createElement('div');
  docTabs.className = 'doc-tabs';
  docTabs.innerHTML = `
    <button class="doc-tab ${t.viewMode === 'pdf' ? 'active' : ''}" id="tabPdf">📄 Đề thi (PDF)</button>
    <button class="doc-tab ${t.viewMode === 'transcript' ? 'active' : ''}" id="tabTranscript">📝 Script Listening (1-100)</button>
  `;
  docWrap.appendChild(docTabs);

  const docContent = document.createElement('div');
  docContent.id = 'docContentArea';
  docContent.className = 'doc-content';
  docWrap.appendChild(docContent);
  split.appendChild(docWrap);

  const ansPanel = document.createElement('div');
  ansPanel.className = 'answer-panel';

  const aimPanel = document.createElement('div');
  aimPanel.className = 'aim-panel';
  aimPanel.innerHTML = `
    <div class="aim-header">
      <div class="aim-input-wrap">
        <span>🎯 Mục tiêu (Aim):</span>
        <input type="number" id="aimInput" value="${userAimScore}" step="50" min="200" max="990">
        <span>điểm</span>
      </div>
      <div id="scoreDisplay" class="score"></div>
    </div>
    <div class="aim-feedback" id="aimFeedback"></div>
  `;
  ansPanel.appendChild(aimPanel);

  const head = document.createElement('div');
  head.className = 'answer-head';
  const title = document.createElement('strong');
  title.textContent = 'Bảng trả lời: ' + t.name;
  head.appendChild(title);

  const headBtns = document.createElement('div');
  headBtns.className = 'answer-head-btns';

  const selTest = document.createElement('select');
  for (let i = 1; i <= 10; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = 'ETS Test ' + i;
    if (t.testNum === i) opt.selected = true;
    selTest.appendChild(opt);
  }
  selTest.addEventListener('change', (e) => {
    t.testNum = parseInt(e.target.value, 10);
    t.name = 'ETS Test ' + t.testNum;
    t.key = (window.TOEIC_KEYS && window.TOEIC_KEYS[t.testNum]) ? window.TOEIC_KEYS[t.testNum] : {};
    renderSidebar();
    renderMain();
  });
  headBtns.appendChild(selTest);

  const clearBtn = document.createElement('button');
  clearBtn.textContent = 'Xoá chọn';
  clearBtn.addEventListener('click', () => { 
    t.answers = {}; 
    renderMain(); 
  });
  headBtns.appendChild(clearBtn);
  head.appendChild(headBtns);
  ansPanel.appendChild(head);

  const scrollArea = document.createElement('div');
  scrollArea.className = 'scroll-area';

  const grid = document.createElement('div');
  grid.className = 'qgrid';
  for (let q = 1; q <= t.numQuestions; q++) {
    const isGraded = !!t.key[q];
    const row = document.createElement('div');
    row.id = `qrow-${q}`;
    row.className = 'qrow' + (isGraded ? ' graded' : '');

    const num = document.createElement('span');
    num.className = 'qnum';
    num.textContent = q;
    row.appendChild(num);

    OPTS.forEach(letter => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.setAttribute('data-letter', letter);
      b.textContent = letter;
      if (t.answers[q] === letter) b.classList.add('selected');
      if (isGraded) {
        if (letter === t.key[q]) b.classList.add('right-answer');
        if (t.answers[q] === letter && letter === t.key[q]) b.classList.add('correct');
        if (t.answers[q] === letter && letter !== t.key[q]) b.classList.add('wrong');
      }
      b.addEventListener('click', () => {
        t.answers[q] = (t.answers[q] === letter) ? undefined : letter;
        if (t.answers[q] === undefined) delete t.answers[q];
        updateQuestionRowDOM(t, q);
        updateScoreAndAimDisplay(t);
      });
      row.appendChild(b);
    });
    grid.appendChild(row);
  }
  scrollArea.appendChild(grid);

  const notesSection = document.createElement('div');
  notesSection.id = 'notesSectionContainer';
  notesSection.className = 'notes-section';
  scrollArea.appendChild(notesSection);

  ansPanel.appendChild(scrollArea);
  split.appendChild(ansPanel);
  mainEl.appendChild(split);

  document.getElementById('aimInput').addEventListener('change', (e) => {
    userAimScore = parseInt(e.target.value, 10) || 700;
    localStorage.setItem('toeic_user_aim', userAimScore);
    updateScoreAndAimDisplay(t);
  });

  document.getElementById('tabPdf').addEventListener('click', () => {
    t.viewMode = 'pdf';
    document.getElementById('tabPdf').classList.add('active');
    document.getElementById('tabTranscript').classList.remove('active');
    updateDocViewer(t);
  });
  document.getElementById('tabTranscript').addEventListener('click', () => {
    t.viewMode = 'transcript';
    document.getElementById('tabTranscript').classList.add('active');
    document.getElementById('tabPdf').classList.remove('active');
    updateDocViewer(t);
  });

  updateDocViewer(t);
  updateScoreAndAimDisplay(t);
  renderNotesSection(t);
}

renderSidebar();
renderMain();
</script>
</body>
</html>
