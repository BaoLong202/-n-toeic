<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện Thi TOEIC </title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --border: #e2e2e6; --text: #1c1c1f; --muted: #6b6b73;
    --accent: #2f6fed; --accent-soft: #e8f0fe; --danger: #d9463c; --good: #1f9254; --bad: #d9463c;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 6px; }
  header button { font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; font-weight: 600;}
  
  .layout { flex: 1; display: flex; min-height: 0; position: relative; }
  .sidebar { width: 280px; max-width: 100%; border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; flex-shrink: 0; background: var(--panel); }
  .add-btn { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-size: 13px; cursor: pointer; margin-bottom: 10px; font-weight: 500; }
  .test-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--bg); cursor: pointer; }
  .test-card.active { border-color: var(--accent); background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .test-card .name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .test-card .status { font-size: 11px; color: var(--muted); display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .test-card .status span.ok { color: var(--good); font-weight: bold; }
  .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-btns label, .row-btns button { font-size: 11px; padding: 5px 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  .row-btns .del { color: var(--danger); border-color: var(--danger); margin-left: auto; }
  input[type="file"] { display: none; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 10px; gap: 10px; min-height: 0; }
  .empty { margin: auto; color: var(--muted); text-align: center; font-size: 14px; max-width: 340px; line-height: 1.5; padding: 20px; }
  
  .player-bar { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .player-bar audio { flex: 1; min-width: 180px; height: 36px; }
  
  .center-split { flex: 1; display: flex; gap: 10px; min-height: 0; }
  .doc-wrap { flex: 1.2; min-height: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
  .doc-tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); padding: 4px 6px; gap: 6px; }
  .doc-tab { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
  .doc-tab.active { background: var(--panel); color: var(--text); border-color: var(--border); font-weight: 600; }
  .doc-content { flex: 1; position: relative; overflow-y: auto; padding: 12px; }
  .doc-content iframe { width: 100%; height: 100%; border: none; }

  .answer-panel { flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .aim-panel { background: var(--accent-soft); border-bottom: 1px solid var(--border); padding: 8px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .aim-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .aim-input-wrap { display: flex; align-items: center; gap: 4px; }
  .aim-input-wrap input { width: 55px; padding: 3px 6px; border-radius: 4px; border: 1px solid var(--accent); font-weight: bold; text-align: center; }
  .aim-feedback { font-size: 11.5px; line-height: 1.4; color: var(--text); background: var(--panel); padding: 6px 8px; border-radius: 6px; border-left: 3px solid var(--accent); }

  .answer-head { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .answer-head-btns { display: flex; gap: 6px; align-items: center; }
  .answer-head-btns select { font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); }
  .btn-grade { background: var(--good) !important; color: white !important; border-color: var(--good) !important; font-weight: bold; }
  .btn-clear { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;}

  .scroll-area { flex: 1; overflow-y: auto; padding: 10px; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; align-content: start; }
  .qrow { display: flex; align-items: center; justify-content: space-between; gap: 2px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; }
  .qrow .qnum { font-size: 11px; color: var(--muted); font-weight: 600; min-width: 22px; }
  .qrow .opt { font-size: 12px; font-weight: 600; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .qrow .opt.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .qrow.graded .opt.selected.correct { background: var(--good); border-color: var(--good); }
  .qrow.graded .opt.selected.wrong { background: var(--bad); border-color: var(--bad); }
  .qrow.graded .opt.right-answer:not(.selected) { border-color: var(--good); color: var(--good); font-weight: bold; background: rgba(31, 146, 84, 0.1); }

  .notes-section { margin-top: 14px; }
  .notes-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--danger); display: flex; align-items: center; gap: 6px; }
  .note-item { border: 1px solid var(--border); border-left: 4px solid var(--bad); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: var(--panel); }
  .note-item .note-head { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .note-item .explanation-box { font-size: 12px; line-height: 1.5; background: var(--bg); padding: 8px; border-radius: 6px; border: 1px dashed var(--border); color: var(--text); }

  .script-container h3 { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-top: 20px; font-size: 14px; }
  .script-item { margin-bottom: 10px; padding: 8px; border-radius: 6px; background: var(--bg); border-left: 3px solid var(--accent); font-size: 12.5px; }
  .script-item .qnum { font-weight: bold; color: var(--good); }
  .script-item .right-ans { font-weight: bold; color: var(--good); }
  .script-dialogue { margin-bottom: 12px; padding: 10px; border-radius: 6px; background: var(--bg); font-size: 12.5px; line-height: 1.5; }

  /* Bảng Tra Từ Vựng */
  .vocab-panel { position: fixed; top: 0; right: -360px; width: min(340px, 90vw); height: 100%; background: var(--panel); border-left: 1px solid var(--border); padding: 14px; overflow-y: auto; transition: right .25s ease; z-index: 30; box-shadow: -6px 0 16px rgba(0,0,0,.1); }
  .vocab-panel.open { right: 0; }
  .vocab-panel h2 { font-size: 15px; margin: 0 0 10px; }
  .vocab-panel .close-x { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; }
  .vocab-search { display: flex; gap: 6px; margin-bottom: 12px; }
  .vocab-search input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; }
  .vocab-search button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; }
  .vocab-result { margin-top: 15px; }
  .vocab-result .word { font-size: 18px; font-weight: 700; color: var(--accent); }
  .vocab-result .pos { font-size: 12px; font-weight: 600; color: var(--good); margin-top: 10px; }
  .vocab-result .def { font-size: 13px; margin: 4px 0; line-height: 1.4; border-bottom: 1px solid var(--border); padding-bottom: 6px;}

  @media (max-width: 768px) {
    .sidebar { position: fixed; top: 48px; left: 0; bottom: 0; z-index: 25; width: 85%; transform: translateX(-100%); transition: transform 0.25s ease; }
    .sidebar.open { transform: translateX(0); }
    .center-split { flex-direction: column; }
    .doc-wrap { height: 40vh; flex: none; }
  }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
  .overlay.open { display: block; }
</style>
<script src="data-toeic.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="sidebarToggleBtn">☰ Đề</button>
      <h1>📘 Luyện Thi TOEIC </h1>
    </div>
    <button id="vocabToggleBtn">🔤 Tra từ</button>
  </header>
  
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <button class="add-btn" id="addTestBtn">+ Thêm đề thi mới</button>
      <div id="testList"></div>
    </div>
    
    <div class="main" id="main">
      <div class="empty" id="emptyMsg">
        Bấm <b>"+ Thêm đề thi mới"</b> ở cột trái.<br><br>
        1. Chọn bộ đề (Test 1 - 10).<br>
        2. Tải file PDF và Audio (nếu có).<br>
        3. Làm bài và bấm <b>"Chấm Bài"</b> để xem điểm, từ vựng và lời giải chi tiết.
      </div>
    </div>
    
    <div class="overlay" id="overlay"></div>
    
    <!-- Khung Tra Từ -->
    <div class="vocab-panel" id="vocabPanel">
      <button class="close-x" id="vocabCloseBtn">✕</button>
      <h2>🔤 Tra từ vựng</h2>
      <div class="vocab-search">
        <input type="text" id="vocabInput" placeholder="Nhập từ tiếng Anh...">
        <button id="vocabSearchBtn">Tra</button>
      </div>
      <div class="vocab-result" id="vocabResult"></div>
    </div>
  </div>
</div>

<script>
let tests = [];
let activeId = null;
let idCounter = 0;
let userAimScore = parseInt(localStorage.getItem('toeic_user_aim') || '700', 10);
const OPTS = ['A','B','C','D'];

const sidebarList = document.getElementById('testList');
const sidebarEl = document.getElementById('sidebar');
const mainEl = document.getElementById('main');
const overlay = document.getElementById('overlay');

document.getElementById('sidebarToggleBtn').addEventListener('click', () => {
  sidebarEl.classList.toggle('open');
  overlay.classList.toggle('open', sidebarEl.classList.contains('open'));
});

document.getElementById('addTestBtn').addEventListener('click', () => {
  idCounter++;
  const testNum = ((idCounter - 1) % 10) + 1;
  const t = {
    id: idCounter, testNum: testNum, name: 'ETS Test ' + testNum,
    pdfFile: null, pdfUrl: null, audioFile: null, audioUrl: null,
    viewMode: 'pdf', isGraded: false, 
    key: (window.TOEIC_DATA && window.TOEIC_DATA.KEYS[testNum]) ? window.TOEIC_DATA.KEYS[testNum] : {},
    numQuestions: 200, answers: {}, notes: {}
  };
  tests.push(t);
  activeId = t.id;
  renderSidebar(); renderMain();
  if (window.innerWidth <= 768) { sidebarEl.classList.remove('open'); overlay.classList.remove('open'); }
});

function renderSidebar() {
  sidebarList.innerHTML = '';
  tests.forEach(t => {
    const card = document.createElement('div');
    card.className = 'test-card' + (t.id === activeId ? ' active' : '');
    card.addEventListener('click', (e) => {
      if (['INPUT','BUTTON','LABEL','SELECT'].includes(e.target.tagName)) return;
      activeId = t.id; renderSidebar(); renderMain();
      if (window.innerWidth <= 768) { sidebarEl.classList.remove('open'); overlay.classList.remove('open'); }
    });

    card.innerHTML = `<div class="name"><span>${t.name}</span></div>
      <div class="status">
        <span class="${t.pdfFile ? 'ok' : ''}">${t.pdfFile ? '✓ Đề' : '– Đề'}</span>
        <span class="${t.audioFile ? 'ok' : ''}">${t.audioFile ? '✓ Audio' : '– Audio'}</span>
      </div>`;

    const btnRow = document.createElement('div');
    btnRow.className = 'row-btns';

    const pdfLabel = document.createElement('label'); pdfLabel.textContent = 'Tải Đề';
    const pdfInput = document.createElement('input'); pdfInput.type = 'file'; pdfInput.accept = 'application/pdf';
    pdfInput.addEventListener('change', (e) => {
      if(e.target.files[0]) { t.pdfFile = e.target.files[0]; t.pdfUrl = URL.createObjectURL(t.pdfFile); renderSidebar(); renderMain(); }
    });
    pdfLabel.appendChild(pdfInput); btnRow.appendChild(pdfLabel);

    const audioLabel = document.createElement('label'); audioLabel.textContent = 'Tải Audio';
    const audioInput = document.createElement('input'); audioInput.type = 'file'; audioInput.accept = 'audio/*';
    audioInput.addEventListener('change', (e) => {
      if(e.target.files[0]) { t.audioFile = e.target.files[0]; t.audioUrl = URL.createObjectURL(t.audioFile); renderSidebar(); renderMain(); }
    });
    audioLabel.appendChild(audioInput); btnRow.appendChild(audioLabel);

    const delBtn = document.createElement('button'); delBtn.className = 'del'; delBtn.textContent = 'Xoá';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tests = tests.filter(x => x.id !== t.id);
      if (activeId === t.id) activeId = tests.length ? tests[0].id : null;
      renderSidebar(); renderMain();
    });
    btnRow.appendChild(delBtn); card.appendChild(btnRow); sidebarList.appendChild(card);
  });
}

function convertRawToScaled(lcCorrect, rcCorrect) {
  let lcScore = 5;
  if (lcCorrect > 0) { lcScore = Math.min(495, Math.round(lcCorrect * 5.2 - 15)); if (lcCorrect >= 90) lcScore = Math.min(495, 450 + (lcCorrect - 90) * 4.5); if (lcScore < 5) lcScore = 5; }
  let rcScore = 5;
  if (rcCorrect > 0) { rcScore = Math.min(495, Math.round(rcCorrect * 5.0 - 20)); if (rcCorrect >= 90) rcScore = Math.min(495, 440 + (rcCorrect - 90) * 5.5); if (rcScore < 5) rcScore = 5; }
  return { lc: lcScore, rc: rcScore, total: lcScore + rcScore };
}

function renderMain() {
  const t = tests.find(x => x.id === activeId);
  if (!t) { mainEl.innerHTML = ''; mainEl.appendChild(emptyMsg); return; }
  mainEl.innerHTML = '';

  const playerBar = document.createElement('div'); playerBar.className = 'player-bar';
  if (t.audioUrl) {
    playerBar.innerHTML = `<audio controls src="${t.audioUrl}" style="flex:1; height:36px;"></audio>`;
  } else {
    playerBar.innerHTML = `<div style="color:var(--muted); font-size:12px;">Chưa tải file Audio.</div>`;
  }
  mainEl.appendChild(playerBar);

  const split = document.createElement('div'); split.className = 'center-split';

  // Khung Document
  const docWrap = document.createElement('div'); docWrap.className = 'doc-wrap';
  docWrap.innerHTML = `
    <div class="doc-tabs">
      <button class="doc-tab ${t.viewMode === 'pdf' ? 'active' : ''}" id="tabPdf">📄 Đề thi (PDF)</button>
      <button class="doc-tab ${t.viewMode === 'transcript' ? 'active' : ''}" id="tabTranscript">📝 Script Listening</button>
    </div>
    <div class="doc-content" id="docContentArea"></div>`;
  split.appendChild(docWrap);

  // Khung Trả lời
  const ansPanel = document.createElement('div'); ansPanel.className = 'answer-panel';
  ansPanel.innerHTML = `
    <div class="aim-panel">
      <div class="aim-header">
        <div class="aim-input-wrap"><span>🎯 Aim:</span><input type="number" id="aimInput" value="${userAimScore}" step="50"></div>
        <div id="scoreDisplay" class="score"></div>
      </div>
      <div class="aim-feedback" id="aimFeedback"></div>
    </div>
    <div class="answer-head">
      <strong>Bảng trả lời</strong>
      <div class="answer-head-btns">
        <select id="testSelector"></select>
        <button id="gradeBtn" class="btn-grade">✔ Chấm Bài</button>
        <button id="clearBtn" class="btn-clear">Xoá</button>
      </div>
    </div>
    <div class="scroll-area"><div class="qgrid" id="qgridArea"></div><div id="notesSectionContainer" class="notes-section"></div></div>
  `;
  split.appendChild(ansPanel); mainEl.appendChild(split);

  // Load Select Options
  const selTest = document.getElementById('testSelector');
  for (let i = 1; i <= 10; i++) {
    const opt = document.createElement('option'); opt.value = i; opt.textContent = 'Đề ' + i;
    if (t.testNum === i) opt.selected = true;
    selTest.appendChild(opt);
  }
  selTest.addEventListener('change', (e) => {
    t.testNum = parseInt(e.target.value, 10); t.name = 'ETS Test ' + t.testNum; t.isGraded = false;
    t.key = (window.TOEIC_DATA && window.TOEIC_DATA.KEYS[t.testNum]) ? window.TOEIC_DATA.KEYS[t.testNum] : {};
    renderSidebar(); renderMain();
  });

  // Action Buttons
  document.getElementById('clearBtn').addEventListener('click', () => { t.answers = {}; t.isGraded = false; renderMain(); });
  document.getElementById('gradeBtn').addEventListener('click', () => { t.isGraded = true; renderMain(); });
  document.getElementById('aimInput').addEventListener('change', (e) => { userAimScore = parseInt(e.target.value, 10) || 700; localStorage.setItem('toeic_user_aim', userAimScore); renderMain(); });

  // Render Grid
  const grid = document.getElementById('qgridArea');
  for (let q = 1; q <= t.numQuestions; q++) {
    const row = document.createElement('div'); row.className = 'qrow' + (t.isGraded ? ' graded' : '');
    row.innerHTML = `<span class="qnum">${q}</span>`;
    OPTS.forEach(letter => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = letter;
      if (t.answers[q] === letter) b.classList.add('selected');
      if (t.isGraded && t.key[q]) {
        if (letter === t.key[q]) b.classList.add('right-answer');
        if (t.answers[q] === letter) b.classList.add(letter === t.key[q] ? 'correct' : 'wrong');
      }
      b.addEventListener('click', () => {
        if (!t.isGraded) { t.answers[q] = (t.answers[q] === letter) ? undefined : letter; renderMain(); }
      });
      row.appendChild(b);
    });
    grid.appendChild(row);
  }

  // Cập nhật Document & Điểm
  const contentArea = document.getElementById('docContentArea');
  if (t.viewMode === 'pdf') {
    contentArea.innerHTML = t.pdfUrl ? `<iframe src="${t.pdfUrl}"></iframe>` : `<div class="no-file">Chưa có PDF. Tải ở cột trái.</div>`;
  } else {
    const scriptHtml = (window.TOEIC_DATA && window.TOEIC_DATA.SCRIPTS[t.testNum]) ? window.TOEIC_DATA.SCRIPTS[t.testNum] : '';
    contentArea.innerHTML = scriptHtml ? `<div class="script-container">${scriptHtml}</div>` : `<div class="no-file">Chưa có Transcript cho đề này.</div>`;
  }

  // Event Tabs
  document.getElementById('tabPdf').addEventListener('click', () => { t.viewMode = 'pdf'; renderMain(); });
  document.getElementById('tabTranscript').addEventListener('click', () => { t.viewMode = 'transcript'; renderMain(); });

  // Update Score & Explanations
  const scoreSpan = document.getElementById('scoreDisplay');
  const aimFeedback = document.getElementById('aimFeedback');
  const answeredCount = Object.keys(t.answers).length;

  if (t.isGraded) {
    let lcCorrect = 0, rcCorrect = 0;
    Object.keys(t.key).forEach(qStr => {
      const q = parseInt(qStr, 10);
      if (t.answers[q] === t.key[q]) { q <= 100 ? lcCorrect++ : rcCorrect++; }
    });
    const scaled = convertRawToScaled(lcCorrect, rcCorrect);
    scoreSpan.innerHTML = `🎯 <b>${scaled.total}</b>/990 <small>(LC:${scaled.lc} | RC:${scaled.rc})</small>`;
    
    const diff = userAimScore - scaled.total;
    if (diff <= 0) {
      aimFeedback.innerHTML = `🎉 <b>Vượt mục tiêu!</b> Bạn đạt <b>${scaled.total}</b> điểm.`; aimFeedback.style.borderLeftColor = 'var(--good)';
    } else {
      aimFeedback.innerHTML = `⚡ Đạt <b>${scaled.total}</b> điểm. Còn thiếu <b>${diff} điểm</b> nữa để đạt Aim ${userAimScore}!`; aimFeedback.style.borderLeftColor = 'var(--danger)';
    }

    // Hiển thị giải thích câu sai
    let notesContainer = document.getElementById('notesSectionContainer');
    const wrongQs = [];
    for (let q = 1; q <= t.numQuestions; q++) { if (t.key[q] && t.answers[q] && t.answers[q] !== t.key[q]) wrongQs.push(q); }
    if (wrongQs.length > 0) {
      const currentExpl = (window.TOEIC_DATA && window.TOEIC_DATA.EXPLANATIONS[t.testNum]) ? window.TOEIC_DATA.EXPLANATIONS[t.testNum] : {};
      let html = `<div class="notes-title">⚠️ Câu sai (${wrongQs.length}) — Lời giải:</div>`;
      wrongQs.forEach(q => {
        const expl = currentExpl[q] || `<i>(Chưa có lời giải cho câu ${q})</i>`;
        html += `<div class="note-item"><div class="note-head">Câu ${q}: Chọn <b style="color:var(--bad)">${t.answers[q]}</b> — Đúng: <b style="color:var(--good)">${t.key[q]}</b></div><div class="explanation-box">${expl}</div></div>`;
      });
      notesContainer.innerHTML = html;
    }
  } else {
    scoreSpan.textContent = `Đã chọn: ${answeredCount} / ${t.numQuestions}`;
    aimFeedback.innerHTML = `💡 Bấm <b>Chấm Bài</b> để xem điểm và lời giải thích.`;
  }
}

// LOGIC TRA TỪ VỰNG
const vocabPanel = document.getElementById('vocabPanel');
const vocabInput = document.getElementById('vocabInput');
const vocabResult = document.getElementById('vocabResult');

document.getElementById('vocabToggleBtn').addEventListener('click', () => { vocabPanel.classList.add('open'); overlay.classList.add('open'); vocabInput.focus(); });
document.getElementById('vocabCloseBtn').addEventListener('click', () => { vocabPanel.classList.remove('open'); overlay.classList.remove('open'); });
overlay.addEventListener('click', () => { vocabPanel.classList.remove('open'); overlay.classList.remove('open'); sidebarEl.classList.remove('open'); });

async function lookupWord() {
  const word = vocabInput.value.trim(); if (!word) return;
  vocabResult.innerHTML = '<div class="vocab-note">Đang tra từ...</div>';
  try {
    const viRes = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(word));
    const viData = await viRes.json();
    const viText = viData[0].map(s => s[0]).join('');
    
    let enHtml = '';
    try {
      const enRes = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
      const enData = await enRes.json();
      if(enData && enData[0]) {
        enHtml += `<div class="word">${enData[0].word}</div><div class="phonetic">${enData[0].phonetic || ''}</div>`;
        enData[0].meanings.slice(0,2).forEach(m => {
          enHtml += `<div class="pos">${m.partOfSpeech}</div>`;
          m.definitions.slice(0,2).forEach(d => { enHtml += `<div class="def">• ${d.definition}</div>`; });
        });
      }
    } catch(e) {}

    vocabResult.innerHTML = enHtml + `<div class="pos">🇻🇳 Dịch nghĩa:</div><div class="def"><b>${viText}</b></div>`;
  } catch (err) {
    vocabResult.innerHTML = '<div class="vocab-note">Lỗi kết nối mạng, vui lòng thử lại sau.</div>';
  }
}
document.getElementById('vocabSearchBtn').addEventListener('click', lookupWord);
vocabInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookupWord(); });

renderSidebar(); renderMain();
</script>
</body>
</html>
